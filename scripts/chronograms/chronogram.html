<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en" lang="en">
<head>
<meta charset="utf-8" />
<title>CADO-NFS Chronogram Viewer</title>
<style type="text/css">
  html, body {
    height: 100%; margin: 0; padding: 0; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background-color: #f4f5f7;
  }
  .app-container { display: flex; flex-direction: column; height: 100vh; padding: 12px; box-sizing: border-box; }
  
  .top-frame {
    flex: 0 0 auto; background: #ffffff; border: 1px solid #ccc;
    border-radius: 4px; padding: 10px 14px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); margin-bottom: 8px;
  }
  .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .header-title { margin: 0; font-size: 16px; color: #222; }

  /* Dropzone & Controls */
  .file-dropzone {
    border: 2px dashed #b0b0b0; background: #fafafa; border-radius: 4px;
    padding: 8px; text-align: center; font-size: 12px; color: #555; cursor: pointer; transition: all 0.2s;
  }
  .file-dropzone.dragover { background: #e8f4ff; border-color: #2b8a3e; }

  .controls-bar {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    background: #f8f9fa; padding: 6px 10px; border-radius: 4px; border: 1px solid #e0e0e0; font-size: 12px; margin-top: 6px;
  }
  .controls-bar label { cursor: pointer; display: flex; align-items: center; gap: 4px; }
  .controls-bar input[type="number"] {
    padding: 2px 4px; font-size: 11px; border: 1px solid #ccc; border-radius: 3px;
  }

  .window-meta { font-size: 11px; color: #666; margin: 6px 0; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px; max-height: 40px; overflow-y: auto; margin-bottom: 6px; }
  .legend-item { display: inline-flex; align-items: center; font-size: 11px; color: #444; }
  .color-box { width: 10px; height: 10px; display: inline-block; margin-right: 4px; border: 1px solid rgba(0,0,0,0.15); }

  /* Information Box guaranteed 2-lines tall to prevent layout jitter */
  #information {
    padding: 6px 10px; background: #1e1e1e; color: #00ff66;
    font-family: SFMono-Regular, Consolas, monospace; font-size: 12px; line-height: 1.4;
    border-radius: 3px; min-height: 2.8em; white-space: pre-wrap; word-break: break-word;
    box-sizing: border-box;
  }

  /* Viewport & Native Scrollbar Container Layout */
  .viewport-layout { flex: 1 1 auto; display: flex; flex-direction: column; overflow: hidden; min-height: 0; }
  .canvas-and-vscroll { flex: 1 1 auto; display: flex; flex-direction: row; min-height: 0; }
  .chart-viewport { flex: 1 1 auto; position: relative; background: #ffffff; border: 1px solid #bbb; border-radius: 4px 0 0 0; overflow: hidden; }
  #viewport-canvas { width: 100%; height: 100%; display: block; cursor: crosshair; }

  /* Native Scrollbar Windows */
  .v-scroll-box {
    width: 16px; flex: 0 0 16px; overflow-y: scroll; overflow-x: hidden;
    background: #f0f0f0; border: 1px solid #bbb; border-left: none; border-radius: 0 4px 0 0;
  }
  .v-scroll-dummy { width: 1px; height: 1px; }

  .h-scroll-row { display: flex; flex-direction: row; height: 16px; flex: 0 0 16px; }
  .h-scroll-box {
    flex: 1 1 auto; overflow-x: scroll; overflow-y: hidden;
    background: #f0f0f0; border: 1px solid #bbb; border-top: none; border-radius: 0 0 0 4px;
  }
  .h-scroll-dummy { height: 1px; width: 1px; }
  .scroll-corner {
    width: 16px; height: 16px; flex: 0 0 16px;
    background: #e0e0e0; border: 1px solid #bbb; border-top: none; border-left: none; border-radius: 0 0 4px 0;
  }
</style>
</head>

<body>
<div class="app-container">

  <div class="top-frame">
    <div class="header-row">
      <h3 class="header-title">CADO-NFS Chronogram Viewer</h3>
      
      <!-- Dropzone -->
      <div class="file-dropzone" id="dropzone">
        📁 Drag & Drop JSON Trace File or <input type="file" id="file-input" accept=".json,.json.gz,.json.zst,.json.zstd" style="display:inline;" />
      </div>
    </div>

    <!-- Controls Row 1 -->
    <div class="controls-bar">
      <strong>Delimiters:</strong>
      <label><input type="radio" name="border-opt" value="none" checked="checked" /> Off</label>
      <label><input type="radio" name="border-opt" value="top" /> On</label>
      
      <span style="color:#ccc;">|</span>
      <strong>Min Duration:</strong>
      <select id="duration-filter">
        <option value="0">Show All</option>
        <option value="0.000001">> 1 µs</option>
        <option value="0.000010">> 10 µs</option>
        <option value="0.000100">> 100 µs</option>
        <option value="0.001000">> 1 ms</option>
        <option value="0.010000">> 10 ms</option>
        <option value="0.100000">> 100 ms</option>
      </select>

      <span style="color:#ccc;">|</span>
      <strong>LOD Coalescing:</strong>
      <select id="lod-mode">
        <option value="mixed" selected="selected">Mixed Activity (Slate Gray)</option>
        <option value="strict">Same Category Only</option>
        <option value="disabled">Disabled (Full Detail)</option>
      </select>

      <span style="color:#ccc;">|</span>
      <button id="reset-view-btn" style="cursor:pointer; font-size:11px;">Reset Zoom</button>

      <span style="color:#ccc;">|</span>
      <span style="font-size: 11px; color: #666;">
        <strong>Scroll / PageUp/Down:</strong> Pan Time
        &nbsp;•&nbsp;
        <strong>Ctrl+Scroll:</strong> Zoom Time
        &nbsp;•&nbsp;
        <strong>Shift+Scroll / Arrows:</strong> Threads
      </span>
    </div>

    <!-- Controls Row 2: Dedicated Manual Viewport Row -->
    <div class="controls-bar" style="margin-top: 4px;">
      <strong>Manual Viewport:</strong>
      <label>t-start (ms): <input type="number" id="input-t-start" step="any" style="width: 75px;" /></label>
      <label>t-span (ms): <input type="number" id="input-t-span" step="any" style="width: 75px;" /></label>
      <span style="color:#ccc;">|</span>
      <label>thr-start: <input type="number" id="input-thr-start" step="any" style="width: 50px;" /></label>
      <label>thr-span: <input type="number" id="input-thr-span" step="any" style="width: 50px;" /></label>
      <button id="apply-viewport-btn" style="cursor:pointer; font-size:11px; font-weight:bold;">Set Viewport</button>
    </div>

    <div class="window-meta" id="meta-info">No trace file loaded.</div>
    <div class="legend" id="legend-container"></div>
    <div id="information">Load a CADO-NFS JSON trace to inspect bubbles...</div>
  </div>

  <div class="viewport-layout">
    <div class="canvas-and-vscroll">
      <div class="chart-viewport">
        <canvas id="viewport-canvas"></canvas>
      </div>
      <div id="v-scrollbar-box" class="v-scroll-box">
        <div id="v-scroll-dummy" class="v-scroll-dummy"></div>
      </div>
    </div>
    <div class="h-scroll-row">
      <div id="h-scrollbar-box" class="h-scroll-box">
        <div id="h-scroll-dummy" class="h-scroll-dummy"></div>
      </div>
      <div class="scroll-corner"></div>
    </div>
  </div>

</div>

<script type="text/javascript">
//<![CDATA[
let TRACE_DATA = null;
let THREADS = [];
let CATEGORY_NAMES = [];
let CATEGORY_COLORS = [];

let winStart = 0, winEnd = 0, totalSpan = 0;

// --- Viewport State ---
let viewStart = 0.0;
let viewSpan = 0.0;

let viewThreadStart = 0.0;
let viewThreadSpan = 0.0;

let showDelimiters = false;
let minDurationThreshold = 0;
let lodMode = "mixed"; // "mixed", "strict", "disabled"
const LOD_THRESHOLD_COUNT = 20000;

let activeBubble = null;
let renderScheduled = false;

// Tracking for automatic post-render hover updates
let lastMouseX = -1;
let lastMouseY = -1;

// Flag to break event loops between scrollbar listeners and render updates
let isSyncingScrollbars = false;

// Debug Counters
let candidateEventCount = 0;
let renderedShapeCount = 0;
let isLODActive = false;

const LEFT_MARGIN = 75, RIGHT_MARGIN = 20, HEADER_HEIGHT = 30, BOTTOM_MARGIN = 20;
const MIXED_COLOR = "#6c757d"; // Slate Gray for mixed sub-pixel tasks

// Color generator
const PREDEFINED_COLORS = {
  "INIT": "rgb(78, 121, 167)", "SKEWGAUSS": "rgb(242, 142, 43)", "ADJUST": "rgb(225, 87, 89)",
  "ALLOC": "rgb(118, 183, 178)", "FIB": "rgb(89, 161, 79)", "SSS": "rgb(237, 201, 72)",
  "PBR": "rgb(176, 122, 161)", "ECM": "rgb(255, 157, 167)", "DS": "rgb(156, 117, 95)",
  "PCLAT": "rgb(186, 176, 172)", "SLICING": "rgb(92, 192, 222)", "BOTCHED": "rgb(200, 0, 0)"
};

function getCategoryColor(cat) {
  if (PREDEFINED_COLORS[cat.toUpperCase()]) return PREDEFINED_COLORS[cat.toUpperCase()];
  let hash = 0;
  for (let i = 0; i < cat.length; i++) hash = cat.charCodeAt(i) + ((hash << 5) - hash);
  const hue = Math.abs(hash % 360);
  return `hsl(${hue}, 65%, 55%)`;
}

// Read URL Query Parameters
function getUrlParams() {
  const urlParams = new URLSearchParams(window.location.search);
  return {
    tStart: urlParams.has('t_start') ? parseFloat(urlParams.get('t_start')) : null,
    tSpan: urlParams.has('t_span') ? parseFloat(urlParams.get('t_span')) : null,
    thrStart: urlParams.has('thr_start') ? parseFloat(urlParams.get('thr_start')) : null,
    thrSpan: urlParams.has('thr_span') ? parseFloat(urlParams.get('thr_span')) : null
  };
}

// Update URL bar query parameters without reloading the page
function updateUrlParams() {
  if (!TRACE_DATA) return;
  const url = new URL(window.location);
  url.searchParams.set('t_start', (viewStart * 1000).toFixed(2));
  url.searchParams.set('t_span', (viewSpan * 1000).toFixed(2));
  url.searchParams.set('thr_start', viewThreadStart.toFixed(1));
  url.searchParams.set('thr_span', viewThreadSpan.toFixed(1));
  window.history.replaceState({}, '', url);
}

// --- Call Stack Reconstruction ---
function annotateHierarchy() {
  if (!TRACE_DATA) return;

  for (const threadId in TRACE_DATA) {
    const events = TRACE_DATA[threadId];
    if (!events || events.length === 0) continue;

    events.sort((a, b) => (a[0] !== b[0] ? a[0] - b[0] : b[1] - a[1]));

    const stack = [];

    for (let i = 0; i < events.length; i++) {
      const e = events[i];
      const eStart = e[0];

      while (stack.length > 0) {
        const top = stack[stack.length - 1];
        const topEnd = top[0] + top[1];
        if (topEnd <= eStart + 1e-9) {
          stack.pop();
        } else {
          break;
        }
      }

      e.depth = stack.length;
      e.parents = stack.slice();
      stack.push(e);
    }
  }
}

document.addEventListener("DOMContentLoaded", () => {
  const canvas = document.getElementById("viewport-canvas");
  const ctx = canvas.getContext("2d");
  const infoElement = document.getElementById("information");
  const metaElement = document.getElementById("meta-info");
  const legendElement = document.getElementById("legend-container");
  const dropzone = document.getElementById("dropzone");
  const fileInput = document.getElementById("file-input");

  const vScrollBox = document.getElementById("v-scrollbar-box");
  const vScrollDummy = document.getElementById("v-scroll-dummy");
  const hScrollBox = document.getElementById("h-scrollbar-box");
  const hScrollDummy = document.getElementById("h-scroll-dummy");

  const inputTStart = document.getElementById("input-t-start");
  const inputTSpan = document.getElementById("input-t-span");
  const inputThrStart = document.getElementById("input-thr-start");
  const inputThrSpan = document.getElementById("input-thr-span");
  const applyBtn = document.getElementById("apply-viewport-btn");

  function resizeCanvas() {
    const rect = canvas.parentElement.getBoundingClientRect();
    canvas.width = rect.width;
    canvas.height = rect.height;
    render();
    syncScrollbars();
  }

  // Synchronize scrollbars with view state
  function syncScrollbars() {
    if (!TRACE_DATA || totalSpan <= 0 || THREADS.length === 0) return;

    isSyncingScrollbars = true;

    // 1. Vertical Time Scrollbar
    const vBoxH = vScrollBox.clientHeight;
    if (vBoxH > 0 && viewSpan > 0) {
      const vDummyH = Math.max(vBoxH, Math.round(vBoxH * (totalSpan / viewSpan)));
      vScrollDummy.style.height = `${vDummyH}px`;

      const vScrollMax = vDummyH - vBoxH;
      if (vScrollMax > 0 && (totalSpan - viewSpan) > 0) {
        vScrollBox.scrollTop = (viewStart / (totalSpan - viewSpan)) * vScrollMax;
      } else {
        vScrollBox.scrollTop = 0;
      }
    }

    // 2. Horizontal Thread Scrollbar
    const hBoxW = hScrollBox.clientWidth;
    if (hBoxW > 0 && viewThreadSpan > 0) {
      const hDummyW = Math.max(hBoxW, Math.round(hBoxW * (THREADS.length / viewThreadSpan)));
      hScrollDummy.style.width = `${hDummyW}px`;

      const hScrollMax = hDummyW - hBoxW;
      if (hScrollMax > 0 && (THREADS.length - viewThreadSpan) > 0) {
        hScrollBox.scrollLeft = (viewThreadStart / (THREADS.length - viewThreadSpan)) * hScrollMax;
      } else {
        hScrollBox.scrollLeft = 0;
      }
    }

    isSyncingScrollbars = false;
  }

  // Synchronize manual entry fields in control bar
  function syncInputFields() {
    if (!TRACE_DATA) return;
    if (document.activeElement !== inputTStart) inputTStart.value = (viewStart * 1000).toFixed(2);
    if (document.activeElement !== inputTSpan) inputTSpan.value = (viewSpan * 1000).toFixed(2);
    if (document.activeElement !== inputThrStart) inputThrStart.value = viewThreadStart.toFixed(1);
    if (document.activeElement !== inputThrSpan) inputThrSpan.value = viewThreadSpan.toFixed(1);
  }

  // Apply manual entry values from control bar
  function applyManualInputs() {
    if (!TRACE_DATA) return;

    const tStartMs = parseFloat(inputTStart.value);
    const tSpanMs = parseFloat(inputTSpan.value);
    const thrStart = parseFloat(inputThrStart.value);
    const thrSpan = parseFloat(inputThrSpan.value);

    if (!isNaN(tSpanMs) && tSpanMs > 0) {
      viewSpan = tSpanMs / 1000;
    }
    if (!isNaN(tStartMs)) {
      viewStart = Math.max(0, Math.min(totalSpan - viewSpan, tStartMs / 1000));
    }

    if (!isNaN(thrSpan) && thrSpan > 0) {
      viewThreadSpan = Math.max(1.0, Math.min(THREADS.length, thrSpan));
    }
    if (!isNaN(thrStart)) {
      viewThreadStart = Math.max(0, Math.min(THREADS.length - viewThreadSpan, thrStart));
    }

    scheduleRender("Manual Viewport Set");
  }

  // Transient action message display
  function updateViewFeedback(actionLabel) {
    if (!TRACE_DATA || THREADS.length === 0) return;

    const spanMs = (viewSpan * 1000).toFixed(2);
    const startMs = (viewStart * 1000).toFixed(2);
    const endMs = ((viewStart + viewSpan) * 1000).toFixed(2);

    const firstThrIdx = Math.max(0, Math.floor(viewThreadStart));
    const lastThrIdx = Math.min(THREADS.length - 1, Math.ceil(viewThreadStart + viewThreadSpan) - 1);
    const thrCount = Math.round(viewThreadSpan);

    const firstThr = THREADS[firstThrIdx] !== undefined ? `T${THREADS[firstThrIdx]}` : '';
    const lastThr = THREADS[lastThrIdx] !== undefined ? `T${THREADS[lastThrIdx]}` : '';
    const thrRangeStr = (firstThr === lastThr) ? firstThr : `${firstThr}–${lastThr}`;

    const prefix = actionLabel ? `⏳ [${actionLabel}] ` : '';
    infoElement.textContent = `${prefix}Time: +${startMs}ms to +${endMs}ms (${spanMs}ms span) | Threads: ${thrRangeStr} (${thrCount} visible)`;
  }

  function scheduleRender(actionLabel) {
    updateViewFeedback(actionLabel);
    if (!renderScheduled) {
      renderScheduled = true;
      setTimeout(() => {
        requestAnimationFrame(() => {
          render();
          syncScrollbars();
          syncInputFields();
          updateUrlParams();
          updateHover(lastMouseX, lastMouseY); // Auto-update hover message over current pixel
          renderScheduled = false;
        });
      }, 0);
    }
  }

  // --- Load JSON File ---
  function loadJSON(jsonText) {
    try {
      const data = JSON.parse(jsonText);
      TRACE_DATA = data.events;
     
      if ("format" in data) {
          const expected_format = 20260727;
          if (data.format != expected_format) {
              alert(`Data format not understood (got ${data.format}, expected ${expected_format})`);
          }
          /* convert start [0], duration [1], and CPU time [3] to seconds */
          winStart = data.win_start / 1e9;
          winEnd = data.win_end / 1e9;
          for (const threadId in TRACE_DATA) {
            const events = TRACE_DATA[threadId];
            for (let i = 0; i < events.length; i++) {
              events[i][0] /= 1e9; // start
              events[i][1] /= 1e9; // duration
              events[i][3] /= 1e9; // CPU metric
            }
          }
      } else {
          winStart = data.win_start;
          winEnd = data.win_end;
      }

      totalSpan = winEnd - winStart;

      annotateHierarchy();

      THREADS = Object.keys(TRACE_DATA).map(Number).sort((a, b) => a - b);
      
      // Check for Query String URL parameters
      const params = getUrlParams();

      viewSpan = (params.tSpan !== null && !isNaN(params.tSpan) && params.tSpan > 0) 
        ? (params.tSpan / 1000) 
        : totalSpan;

      viewStart = (params.tStart !== null && !isNaN(params.tStart)) 
        ? Math.max(0, Math.min(totalSpan - viewSpan, params.tStart / 1000)) 
        : 0.0;

      viewThreadSpan = (params.thrSpan !== null && !isNaN(params.thrSpan) && params.thrSpan > 0) 
        ? Math.max(1.0, Math.min(THREADS.length, params.thrSpan)) 
        : THREADS.length;

      viewThreadStart = (params.thrStart !== null && !isNaN(params.thrStart)) 
        ? Math.max(0, Math.min(THREADS.length - viewThreadSpan, params.thrStart)) 
        : 0.0;

      CATEGORY_NAMES = data.categories;
      CATEGORY_COLORS = CATEGORY_NAMES.map(getCategoryColor);

      // Render Legend with MIXED activity indicator
      const legendHTML = CATEGORY_NAMES.map((cat, idx) =>
        `<span class="legend-item"><span class="color-box" style="background-color:${CATEGORY_COLORS[idx]};"></span>${cat}</span>`
      );
      legendHTML.push(`<span class="legend-item"><span class="color-box" style="background-color:${MIXED_COLOR};"></span><em>MIXED (LOD)</em></span>`);
      legendElement.innerHTML = legendHTML.join('');

      infoElement.textContent = "Trace loaded! Hover over bubbles or scroll/zoom in 2D.";
      render();
      syncScrollbars();
      syncInputFields();
      updateUrlParams();
    } catch (err) {
      alert("Failed to parse JSON trace: " + err.message);
    }
  }

  // Lazy-loaded inlined WASM Zstandard decoder (@hpcc-js/wasm-zstd)
  let zstdWasmInstance = null;

  async function getZstd() {
    if (!zstdWasmInstance) {
      const { Zstd } = await import("https://cdn.jsdelivr.net/npm/@hpcc-js/wasm-zstd/+esm");
      zstdWasmInstance = await Zstd.load();
    }
    return zstdWasmInstance;
  }

  // Transparent decompression pipeline
  async function decompressAndRead(file) {
    const fileName = file.name.toLowerCase();
    const arrayBuffer = await file.arrayBuffer();

    if (fileName.endsWith(".gz") || fileName.endsWith(".gzip")) {
      const blob = new Blob([arrayBuffer]);
      const decompressedStream = blob.stream().pipeThrough(new DecompressionStream("gzip"));
      return await new Response(decompressedStream).text();
    }

    if (fileName.endsWith(".zst") || fileName.endsWith(".zstd")) {
      try {
        if (typeof DecompressionStream !== "undefined") {
          const blob = new Blob([arrayBuffer]);
          const decompressedStream = blob.stream().pipeThrough(new DecompressionStream("zstd"));
          return await new Response(decompressedStream).text();
        }
      } catch (e) {
        // Fall back to inlined WASM
      }

      const compressedBytes = new Uint8Array(arrayBuffer);
      const zstd = await getZstd();
      const decompressedBytes = zstd.decompress(compressedBytes);
      return new TextDecoder("utf-8").decode(decompressedBytes);
    }

    return new TextDecoder("utf-8").decode(arrayBuffer);
  }

  async function handleFile(file) {
    if (!file) return;

    infoElement.textContent = `Decompressing & reading ${file.name}...`;

    try {
      const jsonText = await decompressAndRead(file);
      loadJSON(jsonText);
    } catch (err) {
      alert(`Error loading ${file.name}: ` + err.message);
      infoElement.textContent = "Error reading file.";
    }
  }

  fileInput.addEventListener("change", (e) => {
    if (e.target.files.length) handleFile(e.target.files[0]);
  });

  dropzone.addEventListener("dragover", (e) => { e.preventDefault(); dropzone.classList.add("dragover"); });
  dropzone.addEventListener("dragleave", () => dropzone.classList.remove("dragover"));
  dropzone.addEventListener("drop", (e) => {
    e.preventDefault();
    dropzone.classList.remove("dragover");
    if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
  });

  function findFirstVisibleIndex(events, targetStart) {
    let low = 0, high = events.length - 1, ans = events.length;
    while (low <= high) {
      const mid = (low + high) >> 1;
      if (events[mid][0] >= targetStart) {
        ans = mid; high = mid - 1;
      } else { low = mid + 1; }
    }
    return ans;
  }

  // Find active ancestor events crossing viewStart
  function getSpanningEvents(events, idx) {
    const spanning = [];
    const addSpanning = (ev) => {
      if (ev && ev[0] < viewStart && (ev[0] + ev[1]) > viewStart) {
        if (!spanning.includes(ev)) spanning.push(ev);
      }
    };

    if (idx > 0) {
      const prev = events[idx - 1];
      addSpanning(prev);
      if (prev.parents) {
        for (const p of prev.parents) addSpanning(p);
      }
    }
    if (idx < events.length) {
      const curr = events[idx];
      addSpanning(curr);
      if (curr.parents) {
        for (const p of curr.parents) addSpanning(p);
      }
    }

    spanning.sort((a, b) => (a.depth || 0) - (b.depth || 0));
    return spanning;
  }

  // --- Main Canvas Render Loop ---
  function render() {
    const W = canvas.width, H = canvas.height;
    ctx.clearRect(0, 0, W, H);
    if (!TRACE_DATA || THREADS.length === 0) return;

    const availableW = W - LEFT_MARGIN - RIGHT_MARGIN;
    const availableH = H - HEADER_HEIGHT - BOTTOM_MARGIN;

    const perThreadWidth = availableW / viewThreadSpan;
    const y_scale = availableH / viewSpan;
    const viewEnd = viewStart + viewSpan;

    const minCol = Math.max(0, Math.floor(viewThreadStart));
    const maxCol = Math.min(THREADS.length - 1, Math.ceil(viewThreadStart + viewThreadSpan));

    // Calculate candidate event count in viewport
    candidateEventCount = 0;
    renderedShapeCount = 0;

    for (let colIdx = minCol; colIdx <= maxCol; colIdx++) {
      const events = TRACE_DATA[THREADS[colIdx]];
      if (!events || events.length === 0) continue;
      
      const idxStart = findFirstVisibleIndex(events, viewStart);
      const spanning = getSpanningEvents(events, idxStart);

      for (let i = 0; i < spanning.length; i++) {
        if (spanning[i][1] >= minDurationThreshold) candidateEventCount++;
      }

      let i = idxStart;
      while (i < events.length && events[i][0] <= viewEnd) {
        if (events[i][1] >= minDurationThreshold) candidateEventCount++;
        i++;
      }
    }

    isLODActive = (lodMode !== "disabled") && (candidateEventCount > LOD_THRESHOLD_COUNT);

    // Time Grid Lines
    ctx.fillStyle = "#777"; ctx.strokeStyle = "#ebebeb"; ctx.font = "11px sans-serif"; ctx.lineWidth = 1;
    for (let i = 0; i <= 8; i++) {
      const rel_t = viewStart + (viewSpan * (i / 8));
      const y = HEADER_HEIGHT + Math.floor(i * (availableH / 8));
      ctx.beginPath(); ctx.moveTo(LEFT_MARGIN - 5, y); ctx.lineTo(W - RIGHT_MARGIN, y); ctx.stroke();

      const ms = rel_t * 1000;
      const msStr = Math.abs(ms) < 0.005 ? "0.00" : ms.toFixed(2);
      ctx.fillText(`${msStr.startsWith('-') ? '' : '+'}${msStr}ms`, 5, y + 4);
    }

    // Thread Headers
    ctx.save();
    ctx.beginPath();
    ctx.rect(LEFT_MARGIN, 0, availableW, HEADER_HEIGHT);
    ctx.clip();

    ctx.fillStyle = "#222"; ctx.font = "11px sans-serif";
    for (let i = 0; i < THREADS.length; i++) {
      const x1 = LEFT_MARGIN + (i - viewThreadStart) * perThreadWidth;
      if (x1 + perThreadWidth >= LEFT_MARGIN && x1 <= W - RIGHT_MARGIN) {
        if (perThreadWidth > 14) ctx.fillText(`T${THREADS[i]}`, x1 + 2, 18);
      }
    }
    ctx.restore();

    // Main Chart Plot Area
    ctx.save();
    ctx.beginPath();
    ctx.rect(LEFT_MARGIN, HEADER_HEIGHT, availableW, availableH);
    ctx.clip();

    ctx.strokeStyle = "#d0d0d0";
    for (let i = 0; i < THREADS.length; i++) {
      const x1 = LEFT_MARGIN + (i - viewThreadStart) * perThreadWidth;
      if (x1 >= LEFT_MARGIN && x1 <= W - RIGHT_MARGIN) {
        ctx.beginPath(); ctx.moveTo(x1, HEADER_HEIGHT); ctx.lineTo(x1, H - BOTTOM_MARGIN); ctx.stroke();
      }
    }

    // --- Render Events ---
    for (let colIdx = minCol; colIdx <= maxCol; colIdx++) {
      const threadId = THREADS[colIdx];
      const events = TRACE_DATA[threadId];
      if (!events || events.length === 0) continue;

      const colX = LEFT_MARGIN + (colIdx - viewThreadStart) * perThreadWidth;
      const idx = findFirstVisibleIndex(events, viewStart);
      const spanningEvents = getSpanningEvents(events, idx);

      if (isLODActive) {
        // --- CATEGORY-AWARE LOD COALESCING ---
        let spanY1 = null, spanY2 = null;
        let spanCat = -1;
        let isMixedSpan = false;

        const processLODEvent = (e) => {
          if (e[0] + e[1] < viewStart) return;
          if (e[1] < minDurationThreshold) return;

          const y1 = HEADER_HEIGHT + (e[0] - viewStart) * y_scale;
          const y2 = HEADER_HEIGHT + ((e[0] + e[1]) - viewStart) * y_scale;
          const h = Math.max(0.5, y2 - y1);

          if (spanY1 === null) {
            spanY1 = y1; spanY2 = y1 + h; spanCat = e[2]; isMixedSpan = false;
          } else {
            const canMergeCategory = (lodMode === "mixed") || (lodMode === "strict" && e[2] === spanCat);

            if (y1 <= spanY2 + 1.2 && canMergeCategory) {
              if (e[2] !== spanCat) isMixedSpan = true;
              spanY2 = Math.max(spanY2, y1 + h);
            } else {
              ctx.fillStyle = isMixedSpan ? MIXED_COLOR : (CATEGORY_COLORS[spanCat] || "#888");
              ctx.fillRect(colX, spanY1, Math.max(1, perThreadWidth), Math.max(1, spanY2 - spanY1));
              renderedShapeCount++;

              spanY1 = y1; spanY2 = y1 + h; spanCat = e[2]; isMixedSpan = false;
            }
          }
        };

        for (let i = 0; i < spanningEvents.length; i++) {
          processLODEvent(spanningEvents[i]);
        }

        for (let i = idx; i < events.length; i++) {
          const e = events[i];
          if (e[0] > viewEnd) break;
          processLODEvent(e);
        }

        if (spanY1 !== null) {
          ctx.fillStyle = isMixedSpan ? MIXED_COLOR : (CATEGORY_COLORS[spanCat] || "#888");
          ctx.fillRect(colX, spanY1, Math.max(1, perThreadWidth), Math.max(1, spanY2 - spanY1));
          renderedShapeCount++;
        }

      } else {
        // --- DETAILED MODE (Depth Insets & Call Stacks) ---
        const drawDetailedEvent = (e) => {
          if (e[1] < minDurationThreshold) return;

          const y1 = HEADER_HEIGHT + (e[0] - viewStart) * y_scale;
          const y2 = HEADER_HEIGHT + ((e[0] + e[1]) - viewStart) * y_scale;
          const h = Math.max(1, y2 - y1);

          const depth = e.depth || 0;
          const maxInset = Math.floor(perThreadWidth / 3);
          const inset = Math.min(depth * 2, maxInset);

          const drawX = colX + inset;
          const drawW = Math.max(1, perThreadWidth - 2 * inset);

          ctx.fillStyle = CATEGORY_COLORS[e[2]];
          ctx.fillRect(drawX, y1, drawW, h);
          renderedShapeCount++;

          if (depth > 0 && h > 2 && drawW > 4) {
            ctx.strokeStyle = "rgba(0, 0, 0, 0.25)";
            ctx.strokeRect(drawX, y1, drawW, h);
          }

          if (showDelimiters) {
            ctx.fillStyle = "rgba(0,0,0,0.6)";
            ctx.fillRect(drawX, y1, drawW, 1);
          }
        };

        for (let i = 0; i < spanningEvents.length; i++) {
          drawDetailedEvent(spanningEvents[i]);
        }

        for (let i = idx; i < events.length; i++) {
          const e = events[i];
          if (e[0] > viewEnd) break;
          drawDetailedEvent(e);
        }
      }
    }

    // Refresh Meta Debug Bar
    const modeBadge = isLODActive 
      ? `<span style="color:#d9534f;font-weight:bold;">⚡ LOD Active (${lodMode.toUpperCase()} - ${renderedShapeCount.toLocaleString()} spans drawn)</span>`
      : `<span style="color:#2b8a3e;font-weight:bold;">Detailed Mode (${renderedShapeCount.toLocaleString()} shapes drawn)</span>`;

    metaElement.innerHTML = `Time Span: <strong>${(totalSpan*1000).toFixed(2)} ms</strong> | Threads: ${THREADS.length} | Viewport Candidate Events: <strong>${candidateEventCount.toLocaleString()}</strong> | ${modeBadge}`;

    // Hover Highlight Box
    if (activeBubble) {
      const [colIdx, e] = activeBubble;
      const colX = LEFT_MARGIN + (colIdx - viewThreadStart) * perThreadWidth;
      const y1 = HEADER_HEIGHT + (e[0] - viewStart) * y_scale;
      const y2 = HEADER_HEIGHT + ((e[0] + e[1]) - viewStart) * y_scale;
      const h = Math.max(1, y2 - y1);

      const depth = isLODActive ? 0 : (e.depth || 0);
      const maxInset = Math.floor(perThreadWidth / 3);
      const inset = Math.min(depth * 2, maxInset);
      const drawX = colX + inset;
      const drawW = Math.max(1, perThreadWidth - 2 * inset);

      ctx.fillStyle = "rgba(0, 0, 0, 0.35)";
      ctx.fillRect(drawX, y1, drawW, h);
      ctx.strokeStyle = "#000000";
      ctx.strokeRect(drawX, y1, drawW, h);
    }

    ctx.restore();
  }

  // Visual-bound hover update routine
  function updateHover(mx, my) {
    if (!TRACE_DATA || THREADS.length === 0) return;

    if (mx < 0 || my < 0) {
      const hadActive = (activeBubble !== null);
      activeBubble = null;
      infoElement.textContent = "Hover over a region to inspect details...";
      if (hadActive) render();
      return;
    }

    const availableW = canvas.width - LEFT_MARGIN - RIGHT_MARGIN;
    const availableH = canvas.height - HEADER_HEIGHT - BOTTOM_MARGIN;
    const perThreadWidth = availableW / viewThreadSpan;
    const y_scale = availableH / viewSpan;

    const colIdx = Math.floor(viewThreadStart + (mx - LEFT_MARGIN) / perThreadWidth);

    let hit = null;
    if (colIdx >= 0 && colIdx < THREADS.length && my >= HEADER_HEIGHT && my <= canvas.height - BOTTOM_MARGIN) {
      const events = TRACE_DATA[THREADS[colIdx]];
      
      if (events && events.length > 0) {
        let deepestHit = null;
        const idx = findFirstVisibleIndex(events, viewStart);

        // Visual screen-pixel hit testing
        const testEvent = (ev) => {
          if (!ev) return;
          if (ev[1] < minDurationThreshold) return;

          const y1 = HEADER_HEIGHT + (ev[0] - viewStart) * y_scale;
          const y2 = y1 + Math.max(1, ev[1] * y_scale);

          if (my >= y1 && my <= y2) {
            if (!deepestHit || (ev.depth || 0) >= (deepestHit.depth || 0)) {
              deepestHit = ev;
            }
          }
        };

        // 1. Test spanning background parents
        const spanningEvents = getSpanningEvents(events, idx);
        for (let i = 0; i < spanningEvents.length; i++) {
          testEvent(spanningEvents[i]);
        }

        // 2. Test events in/near current viewport
        for (let i = idx; i < events.length; i++) {
          const ev = events[i];
          if (ev[0] > viewStart + viewSpan) break;
          testEvent(ev);
        }

        if (deepestHit) hit = [colIdx, deepestHit];
      }
    }

    const activeChanged = (hit !== activeBubble);
    activeBubble = hit;

    // Always update text message to clear transient hourglass prompts
    if (hit) {
      const e = hit[1];
      const catName = CATEGORY_NAMES[e[2]];

      let stackStr = "";
      if (e.parents && e.parents.length > 0) {
        const parentNames = e.parents.map(p => CATEGORY_NAMES[p[2]]).join(" › ");
        stackStr = `Stack: [ ${parentNames} ] › `;
      }

      const lodNote = (isLODActive && lodMode === "mixed") ? " (LOD Sub-pixel Inspection)" : "";
      infoElement.textContent = `Thread ${THREADS[hit[0]]} | ${stackStr}ACTIVE: ${catName}${lodNote} | Start: +${(e[0]*1000).toFixed(3)}ms | Duration: ${(e[1]*1000).toFixed(3)}ms | On CPU: ${(e[3]*1000).toFixed(3)}ms | Details: ${e[4]}`;
    } else {
      infoElement.textContent = "Hover over a region to inspect details...";
    }

    // Only trigger canvas repaint if highlight box changed position or appearance
    if (activeChanged) {
      render();
    }
  }

  // Mouse Move Event Listener with exact bounding box ratio scaling
  canvas.addEventListener("mousemove", (e) => {
    const rect = canvas.getBoundingClientRect();
    lastMouseX = (e.clientX - rect.left) * (canvas.width / rect.width);
    lastMouseY = (e.clientY - rect.top) * (canvas.height / rect.height);
    updateHover(lastMouseX, lastMouseY);
  });

  canvas.addEventListener("mouseleave", () => {
    lastMouseX = -1;
    lastMouseY = -1;
    updateHover(-1, -1);
  });

  // Manual input field listeners
  applyBtn.addEventListener("click", applyManualInputs);

  [inputTStart, inputTSpan, inputThrStart, inputThrSpan].forEach(input => {
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        applyManualInputs();
        input.blur();
      }
    });
  });

  // Scrollbar Event Listeners
  vScrollBox.addEventListener("scroll", () => {
    if (isSyncingScrollbars || !TRACE_DATA) return;
    const vBoxH = vScrollBox.clientHeight;
    const vDummyH = vScrollDummy.offsetHeight;
    const vScrollMax = vDummyH - vBoxH;

    if (vScrollMax > 0) {
      const frac = vScrollBox.scrollTop / vScrollMax;
      viewStart = frac * Math.max(0, totalSpan - viewSpan);
      scheduleRender("Vertical Scroll");
    }
  });

  hScrollBox.addEventListener("scroll", () => {
    if (isSyncingScrollbars || !TRACE_DATA) return;
    const hBoxW = hScrollBox.clientWidth;
    const hDummyW = hScrollDummy.offsetWidth;
    const hScrollMax = hDummyW - hBoxW;

    if (hScrollMax > 0) {
      const frac = hScrollBox.scrollLeft / hScrollMax;
      viewThreadStart = frac * Math.max(0, THREADS.length - viewThreadSpan);
      scheduleRender("Horizontal Scroll");
    }
  });

  // --- 2D Navigation ---
  canvas.addEventListener("wheel", (e) => {
    if (!TRACE_DATA || THREADS.length === 0) return;
    e.preventDefault();

    const rect = canvas.getBoundingClientRect();
    const mouseX = (e.clientX - rect.left) * (canvas.width / rect.width);
    const mouseY = (e.clientY - rect.top) * (canvas.height / rect.height);

    const availableW = canvas.width - LEFT_MARGIN - RIGHT_MARGIN;
    const availableH = canvas.height - HEADER_HEIGHT - BOTTOM_MARGIN;

    const isZoom = e.ctrlKey || e.metaKey;
    const isHorizontal = e.shiftKey || Math.abs(e.deltaX) > Math.abs(e.deltaY);

    let actionLabel = "";

    if (isHorizontal && isZoom) {
      actionLabel = "Zooming Threads";
      const mouseRelX = Math.max(0, Math.min(1, (mouseX - LEFT_MARGIN) / availableW));
      const threadFocus = viewThreadStart + mouseRelX * viewThreadSpan;
      const zoomFactor = e.deltaY > 0 ? 1.15 : 0.85;
      const newSpan = Math.max(1.0, Math.min(THREADS.length, viewThreadSpan * zoomFactor));

      viewThreadStart = Math.max(0, Math.min(THREADS.length - newSpan, threadFocus - mouseRelX * newSpan));
      viewThreadSpan = newSpan;

    } else if (isHorizontal) {
      actionLabel = "Panning Threads";
      const delta = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
      const panAmount = (delta / availableW) * viewThreadSpan * 0.4;
      viewThreadStart = Math.max(0, Math.min(THREADS.length - viewThreadSpan, viewThreadStart + panAmount));

    } else if (isZoom) {
      actionLabel = "Zooming Time";
      const mouseRelY = Math.max(0, Math.min(1, (mouseY - HEADER_HEIGHT) / availableH));
      const tFocus = viewStart + mouseRelY * viewSpan;
      const zoomFactor = e.deltaY > 0 ? 1.15 : 0.85;
      const newSpan = Math.max(0.000001, Math.min(totalSpan * 2, viewSpan * zoomFactor));

      viewStart = tFocus - mouseRelY * newSpan;
      viewSpan = newSpan;

    } else {
      actionLabel = "Panning Time";
      const panAmount = (e.deltaY / canvas.height) * viewSpan * 0.4;
      viewStart = Math.max(0.0 - viewSpan * 0.1, Math.min(totalSpan - viewSpan * 0.9, viewStart + panAmount));
    }

    scheduleRender(actionLabel);
  }, { passive: false });

  // Keyboard Shortcuts
  window.addEventListener("keydown", (e) => {
    if (!TRACE_DATA || THREADS.length === 0) return;
    if (["INPUT", "SELECT", "TEXTAREA", "BUTTON"].includes(document.activeElement.tagName)) return;

    let actionLabel = "";

    switch (e.key) {
      case "PageUp":
        actionLabel = "Page Up";
        viewStart = Math.max(0.0, viewStart - viewSpan * 0.8);
        break;
      case "PageDown":
        actionLabel = "Page Down";
        viewStart = Math.min(Math.max(0.0, totalSpan - viewSpan), viewStart + viewSpan * 0.8);
        break;
      case "Home":
        actionLabel = "Jump to Start";
        viewStart = 0.0;
        break;
      case "End":
        actionLabel = "Jump to End";
        viewStart = Math.max(0.0, totalSpan - viewSpan);
        break;
      case "ArrowUp":
        actionLabel = "Nudge Time Up";
        viewStart = Math.max(0.0, viewStart - viewSpan * 0.1);
        break;
      case "ArrowDown":
        actionLabel = "Nudge Time Down";
        viewStart = Math.min(Math.max(0.0, totalSpan - viewSpan), viewStart + viewSpan * 0.1);
        break;
      case "ArrowLeft":
        actionLabel = "Nudge Threads Left";
        viewThreadStart = Math.max(0.0, viewThreadStart - Math.max(1.0, viewThreadSpan * 0.1));
        break;
      case "ArrowRight":
        actionLabel = "Nudge Threads Right";
        viewThreadStart = Math.min(Math.max(0.0, THREADS.length - viewThreadSpan), viewThreadStart + Math.max(1.0, viewThreadSpan * 0.1));
        break;
      default:
        return;
    }

    e.preventDefault();
    scheduleRender(actionLabel);
  });

  // Control Event Listeners
  document.querySelectorAll("input[name='border-opt']").forEach(r => r.addEventListener("change", (e) => { showDelimiters = (e.target.value === "top"); scheduleRender("Toggle Delimiters"); }));
  document.getElementById("duration-filter").addEventListener("change", (e) => { minDurationThreshold = parseFloat(e.target.value); scheduleRender("Filter Applied"); });
  document.getElementById("lod-mode").addEventListener("change", (e) => { lodMode = e.target.value; scheduleRender("LOD Mode Changed"); });
  document.getElementById("reset-view-btn").addEventListener("click", () => {
    viewStart = 0;
    viewSpan = totalSpan;
    viewThreadStart = 0.0;
    viewThreadSpan = THREADS.length;
    scheduleRender("Reset View");
  });

  window.addEventListener("resize", resizeCanvas);
  resizeCanvas();
});

</script>
